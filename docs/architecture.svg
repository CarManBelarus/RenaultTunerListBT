<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%" style="background-color:#1e1e1e; font-family:monospace;">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#00ffcc" />
        </marker>
        <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff4444" />
        </marker>
    </defs>

    <!-- Background Grids for Cores -->
    <rect x="20" y="50" width="400" height="500" rx="10" fill="#2d2d2d" stroke="#555" stroke-width="2"/>
    <text x="30" y="80" fill="#aaaaaa" font-size="18" font-weight="bold">Core 0 (PRO_CPU)</text>
    <text x="30" y="100" fill="#777777" font-size="12">Bluetooth Stack &amp; I2S Phantom</text>

    <rect x="480" y="50" width="400" height="500" rx="10" fill="#2d2d2d" stroke="#555" stroke-width="2"/>
    <text x="490" y="80" fill="#aaaaaa" font-size="18" font-weight="bold">Core 1 (APP_CPU)</text>
    <text x="490" y="100" fill="#777777" font-size="12">Strict Real-Time S/PDIF Engine</text>

    <!-- Core 0 Components -->
    <rect x="50" y="130" width="340" height="80" rx="5" fill="#334455" stroke="#00ffcc" stroke-width="1"/>
    <text x="110" y="165" fill="#ffffff" font-size="16">Bluedroid Stack (A2DP / AVRCP)</text>
    <text x="120" y="185" fill="#00ffcc" font-size="12">Event Queue: 150 Slots (Flood Protect)</text>

    <rect x="50" y="250" width="340" height="80" rx="5" fill="#334455" stroke="#00ffcc" stroke-width="1"/>
    <text x="140" y="285" fill="#ffffff" font-size="16">app_task (System)</text>
    <text x="70" y="305" fill="#00ffcc" font-size="12">Configures Sample Rate / Extracts Metadata</text>

    <rect x="50" y="420" width="340" height="60" rx="5" fill="#552222" stroke="#ff4444" stroke-width="2"/>
    <text x="110" y="445" fill="#ffffff" font-size="14" font-weight="bold">Phantom I2S_NUM_1</text>
    <text x="75" y="465" fill="#ffaa00" font-size="12">Absorbs FreeRTOS Spinlocks (Mutex Trap)</text>

    <!-- Core 1 Components -->
    <rect x="510" y="130" width="340" height="80" rx="5" fill="#334455" stroke="#00ffcc" stroke-width="1"/>
    <text x="590" y="165" fill="#ffffff" font-size="16">spdif_task_continuous</text>
    <text x="540" y="185" fill="#00ffcc" font-size="12">Priority: MAX. Anti-Jitter Loop (No vTaskDelay)</text>

    <rect x="510" y="420" width="340" height="60" rx="5" fill="#225522" stroke="#44ff44" stroke-width="2"/>
    <text x="610" y="445" fill="#ffffff" font-size="14" font-weight="bold">Physical I2S_NUM_0</text>
    <text x="560" y="465" fill="#44ff44" font-size="12">DMA Hardware Shift Register -> S/PDIF</text>

    <!-- Shared Resources -->
    <rect x="300" y="350" width="300" height="40" rx="5" fill="#443355" stroke="#ffaa00" stroke-width="2"/>
    <text x="350" y="375" fill="#ffffff" font-size="14" font-weight="bold">FreeRTOS RingBuffer (32KB)</text>

    <!-- Flow Lines -->
    <path d="M 220 210 L 220 250" stroke="#00ffcc" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <path d="M 220 330 L 220 420" stroke="#ff4444" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow-red)"/>
    <text x="230" y="380" fill="#ff4444" font-size="12">i2s_set_sample_rates()</text>

    <path d="M 390 290 L 450 350" stroke="#00ffcc" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="400" y="330" fill="#00ffcc" font-size="12">PCM Data</text>

    <path d="M 450 390 L 510 200" stroke="#00ffcc" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <path d="M 680 210 L 680 420" stroke="#44ff44" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="690" y="320" fill="#44ff44" font-size="12">BMC Encoded Frames</text>

    <!-- DSP Out -->
    <path d="M 850 450 L 900 450" stroke="#44ff44" stroke-width="4" fill="none" />
    <text x="860" y="440" fill="#ffffff" font-size="12">To SAA7708H</text>
</svg>
