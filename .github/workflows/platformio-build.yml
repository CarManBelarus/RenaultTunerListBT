name: PlatformIO CI/CD Pipeline

on:
  push:
    branches:[ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [published]

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Provision Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Deploy PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Execute Firmware Compilation
        run: pio run -e esp32dev

      - name: Upload Binary Artifact (CI)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: Renault_BT_Emulator_Firmware
          path: .pio/build/esp32dev/firmware.bin
          retention-days: 14

      - name: Attach Binary to GitHub Release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: .pio/build/esp32dev/firmware.bin
          asset_name: Renault_TunerList_BT_Emulator.bin
          tag: ${{ github.ref }}
          overwrite: true
